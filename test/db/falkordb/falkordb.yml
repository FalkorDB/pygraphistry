version: "3.7"

services:
  falkordb-test:
    image: falkordb/falkordb:latest
    container_name: falkordb-test
    ports:
      - "6379:6379"
    environment:
      - FALKORDB_ARGS=--requirepass test
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
